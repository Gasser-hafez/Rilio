# بيبني الـ installer وينشره كـ draft release لما تعمل push لـ tag زي v4.2.0
# التحديث مبيوصلش لحد غير لما تدوس "Publish release" على GitHub بنفسك
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write # إنشاء الـ release ورفع الملفات بس

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Tag must match package.json version
        shell: bash
        run: |
          v="v$(node -p "require('./package.json').version")"
          [ "$v" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME != package.json $v"; exit 1; }

      - run: npm ci
      - run: npm ci --prefix party-server
      # النتيجة بتتكتب كـ annotation (بتتشاف من غير تسجيل دخول) — عشان نتأكد إن الاختبارات كلها اشتغلت فعلاً
      - name: Server tests (protocol + real worker via wrangler dev)
        shell: bash
        run: |
          set -o pipefail
          npm test --prefix party-server 2>&1 | tee server-tests.txt || { echo "::error title=server tests::$(tail -8 server-tests.txt | paste -sd' ' -)"; exit 1; }
          echo "::notice title=server tests::$(grep -E '^ℹ (pass|fail)' server-tests.txt | paste -sd' ' -)"
      - name: App tests (unit + e2e, incl. Watch Party between two instances)
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee app-tests.txt || { echo "::error title=app tests::$(tail -8 app-tests.txt | paste -sd' ' -)"; exit 1; }
          echo "::notice title=app tests::$(grep -E '^ℹ (pass|fail)|checks passed|^run [0-9]' app-tests.txt | paste -sd' ' -)"

      # لازم الـ draft يتعمل قبل electron-builder — لو ملقاش release بيرفع الملفات بالتوازي
      # وكل رفعة بتعمل draft لوحدها (حصلت في v4.1.0: draft فيه الـ blockmap وتاني فيه الباقي)
      - name: Create draft release
        shell: bash
        run: gh release create "$GITHUB_REF_NAME" --draft --title "${GITHUB_REF_NAME#v}" --notes "$GITHUB_REF_NAME"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and upload to draft release
        run: npx electron-builder --win nsis --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify single draft has all update files
        shell: bash
        run: |
          v="${GITHUB_REF_NAME#v}"
          n=$(gh release list --json tagName,isDraft --jq "[.[] | select(.tagName==\"$GITHUB_REF_NAME\")] | length")
          [ "$n" = "1" ] || { echo "expected 1 release for $GITHUB_REF_NAME, found $n"; exit 1; }
          assets=$(gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name')
          echo "$assets"
          for f in latest.yml "rilio-Setup-$v.exe" "rilio-Setup-$v.exe.blockmap"; do
            echo "$assets" | grep -qxF "$f" || { echo "missing $f"; exit 1; }
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
