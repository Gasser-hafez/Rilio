<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- أيقونة rilio: Liquid Glass — حرف R فراغه زرار تشغيل، زجاج فوق ألوان متوهجة.. المصدر اللي اتعمل منه icon*.png و icon.ico -->
  <defs>
