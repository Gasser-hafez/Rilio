    <radialGradient id="gb2"><stop offset="0" stop-color="#ffae1f"/><stop offset="1" stop-color="#ffae1f" stop-opacity="0"/></radialGradient>
    <radialGradient id="gb3"><stop offset="0" stop-color="#5b45ff"/><stop offset="1" stop-color="#5b45ff" stop-opacity="0"/></radialGradient>
    <radialGradient id="gb4"><stop offset="0" stop-color="#00cfff"/><stop offset="1" stop-color="#00cfff" stop-opacity="0"/></radialGradient>
    <linearGradient id="m2Edge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity="0.95"/><stop offset="0.5" stop-color="#fff" stop-opacity="0.15"/><stop offset="1" stop-color="#fff" stop-opacity="0.6"/></linearGradient>
    <linearGradient id="m2Fill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity="0.42"/><stop offset="1" stop-color="#fff" stop-opacity="0.12"/></linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity="0.18"/><stop offset="0.35" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#000" flood-opacity="0.5"/></filter>
