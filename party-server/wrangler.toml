name = "watchlist-party"
main = "src/index.js"
compatibility_date = "2026-09-01"
workers_dev = true

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

# حد للاتصالات الجديدة لكل IP — يمنع حد يخلّص الحصة المجانية بسيل اتصالات
[[ratelimits]]
name = "CONNECT_LIMITER"
namespace_id = "1001"
simple = { limit = 60, period = 60 }

# ملفات صفحة الضيف (/join/CODE) — الـ Worker بيشوف كل طلب الأول ويحط الـ headers الأمنية
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
